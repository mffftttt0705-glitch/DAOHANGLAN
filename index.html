<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具导航</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 液态背景 -->
  <div class="liquid-bg" id="liquidBg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <!-- 图片背景 -->
  <div class="custom-bg" id="customBg"></div>
  <!-- 视频背景 -->
  <video id="bgVideo" class="bg-video" autoplay muted loop playsinline></video>
  <div class="bg-overlay"></div>

  <!-- 特效画布：花瓣 / 雪花 / 雨 -->
  <canvas id="fxCanvas" class="fx-canvas"></canvas>

  <div class="page">
    <!-- 装饰顶线 -->
    <div class="deco-top" aria-hidden="true">
      <span class="deco-line"></span>
      <span class="deco-dot"></span>
      <span class="deco-line"></span>
    </div>

    <!-- 个人区：仅一个头像 -->
    <section class="profile">
      <div class="avatar-frame">
        <div class="avatar-ring"></div>
        <img id="avatarImg" class="avatar" src="" alt="头像" />
      </div>

      <div class="name-block">
        <div class="deco-side-lines" aria-hidden="true">
          <span></span><span></span>
        </div>
        <h1 id="displayName" class="name">未设置昵称</h1>
        <div class="deco-side-lines" aria-hidden="true">
          <span></span><span></span>
        </div>
      </div>

      <p id="displayBio" class="bio">点击右下角设置进行个性化</p>

      <div class="deco-underline" aria-hidden="true">
        <span class="deco-line short"></span>
        <span class="deco-diamond"></span>
        <span class="deco-line short"></span>
      </div>
    </section>

    <section class="links">
      <button type="button" class="link-box" id="openChat">
        <span class="link-title">AI 对话</span>
        <span class="link-desc">多模型 · 商汤 / DeepSeek / 通义 / 智谱 / Kimi</span>
      </button>
      <button type="button" class="link-box" id="openConverter">
        <span class="link-title">视频 → MP3</span>
        <span class="link-desc">本地转换，支持常见视频格式</span>
      </button>
    </section>

    <div class="deco-bottom" aria-hidden="true">
      <span class="deco-line"></span>
      <span class="deco-dot"></span>
      <span class="deco-line"></span>
    </div>
  </div>

  <!-- 背景快捷切换（无需密码） -->
  <div class="bg-bar" id="bgBar" hidden>
    <!-- 由 JS 动态填充按钮 -->
  </div>

  <!-- 特效快捷切换（无需密码） -->
  <div class="fx-bar" id="fxBar">
    <button type="button" class="fx-btn active" data-fx="none" title="无特效">关</button>
    <button type="button" class="fx-btn" data-fx="petal" title="花瓣">🌸</button>
    <button type="button" class="fx-btn" data-fx="snow" title="雪花">❄</button>
    <button type="button" class="fx-btn" data-fx="rain" title="下雨">🌧</button>
  </div>

  <button type="button" class="fab" id="settingsBtn" title="设置">⚙</button>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-panel glass">
      <h2>个性化设置</h2>
      <p class="modal-hint">需要密码才能修改</p>

      <div class="field">
        <label>密码</label>
        <input type="password" id="pwdInput" placeholder="输入密码" autocomplete="off" />
      </div>

      <div id="settingsForm" class="settings-form" hidden>
        <div class="field">
          <label>昵称</label>
          <input type="text" id="nameInput" placeholder="显示名称" maxlength="20" />
        </div>
        <div class="field">
          <label>简介</label>
          <input type="text" id="bioInput" placeholder="一句话介绍" maxlength="40" />
        </div>
        <div class="field">
          <label>头像（图片链接或本地上传）</label>
          <input type="text" id="avatarUrlInput" placeholder="https://... 图片地址" />
          <input type="file" id="avatarFileInput" accept="image/*" />
        </div>

        <div class="field">
          <label>背景列表（支持多张图片 / 视频，可随时切换）</label>
          <div id="bgList" class="bg-list"></div>
          <div class="bg-add-row">
            <input type="text" id="bgLabelInput" placeholder="备注名（可选）" maxlength="12" />
            <select id="bgTypeSelect">
              <option value="image">图片</option>
              <option value="video">视频</option>
            </select>
          </div>
          <input type="text" id="bgUrlInput" placeholder="https://... 图片或视频地址（视频必须用链接）" />
          <input type="file" id="bgFileInput" accept="image/*" />
          <p class="field-tip">视频请上传到免费图床/网盘后粘贴直链；本地图片可直接上传（会转 base64 存入 KV，建议 &lt; 800KB）</p>
          <button type="button" class="btn-text" id="addBgBtn">＋ 添加到背景列表</button>
        </div>

        <div class="field">
          <label>飘落特效</label>
          <select id="fxSelect">
            <option value="none">关闭</option>
            <option value="petal">花瓣</option>
            <option value="snow">雪花</option>
            <option value="rain">下雨</option>
          </select>
        </div>
        <button type="button" class="btn primary" id="saveBtn">保存到云端（所有人可见）</button>
      </div>

      <button type="button" class="btn ghost" id="closeModal">关闭</button>
    </div>
  </div>

  <div class="modal" id="converterModal" hidden>
    <div class="modal-mask" id="converterMask"></div>
    <div class="modal-panel glass converter-panel">
      <h2>视频 → MP3</h2>
      <p class="modal-hint">本地转换 · 无需大引擎 · 建议 ≤5 分钟、手机可播的 MP4 最佳</p>

      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="video/*,audio/*,.mp4,.webm,.mov,.mkv,.avi,.flv,.wmv,.m4v,.3gp,.ts,.mpeg,.mpg,.ogv,.m4a" hidden />
        <div class="upload-content" id="uploadContent">
          <p>点击或拖拽视频到这里</p>
          <span class="hint">推荐 MP4（H.264），手机能播放的格式均可</span>
        </div>
        <div class="file-info" id="fileInfo" hidden>
          <span id="fileName"></span>
          <button type="button" class="btn-text" id="clearBtn">清除</button>
        </div>
      </div>

      <button type="button" class="btn primary" id="convertBtn" disabled>开始转换</button>

      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p class="progress-text" id="progressText">准备中…</p>
      </div>

      <div class="result" id="result" hidden>
        <p class="ok">转换完成</p>
        <a id="downloadLink" class="btn primary" download="output.mp3">下载 MP3</a>
      </div>

      <button type="button" class="btn ghost" id="closeConverter">关闭</button>
    </div>
  </div>

  <!-- AI 对话 -->
  <div class="modal" id="chatModal" hidden>
    <div class="modal-mask" id="chatMask"></div>
    <div class="modal-panel glass chat-panel">
      <div class="chat-header">
        <button type="button" class="chat-icon-btn" id="chatMenuBtn" title="菜单" aria-label="菜单">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="chat-header-center">
          <select id="chatModelSelect" class="chat-model-select" title="选择模型">
            <option value="sensenova">商汤日日新</option>
            <option value="deepseek">DeepSeek</option>
            <option value="qwen">通义千问</option>
            <option value="zhipu">智谱 GLM</option>
            <option value="kimi">Kimi</option>
            <option value="openai">OpenAI 兼容</option>
          </select>
        </div>
        <button type="button" class="chat-icon-btn" id="closeChat" title="关闭" aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- 侧栏菜单 -->
      <div class="chat-drawer" id="chatDrawer" hidden>
        <button type="button" class="chat-drawer-item" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          新建对话
        </button>
        <button type="button" class="chat-drawer-item" id="toggleSettingsBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          API 设置
        </button>
        <div class="chat-drawer-label">历史对话</div>
        <div class="chat-history-list" id="chatHistoryList"></div>
      </div>
      <div class="chat-drawer-mask" id="chatDrawerMask" hidden></div>

      <!-- 可折叠 API 设置 -->
      <div class="chat-settings" id="chatSettings" hidden>
        <div class="chat-key-row" id="chatKeyRow">
          <input type="password" id="chatApiKey" placeholder="粘贴 API Key" autocomplete="off" />
          <button type="button" class="btn-text" id="saveChatKey">保存</button>
        </div>
        <p class="field-tip chat-key-tip" id="chatKeyTip">Key 只存在本机。</p>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-title">有什么可以帮你？</div>
          <div class="chat-empty-hint">选择模型并在菜单中配置 API Key 后开始</div>
        </div>
      </div>

      <div class="chat-attach-preview" id="chatAttachPreview" hidden></div>

      <div class="chat-composer">
        <div class="chat-toolbar">
          <button type="button" class="chat-tool-btn" id="chatPickImage" title="发送图片">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
          </button>
          <button type="button" class="chat-tool-btn" id="chatPickFile" title="发送文件">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          </button>
          <button type="button" class="chat-tool-btn" id="chatGenImage" title="生成图片">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M5 19l.8 2.2L8 22l-2.2.8L5 25l-.8-2.2L2 22l2.2-.8L5 19z" transform="translate(0 -4) scale(0.7)"/></svg>
          </button>
          <button type="button" class="chat-tool-btn" id="chatGenVideo" title="生成视频">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
          </button>
          <input type="file" id="chatImageInput" accept="image/*" hidden />
          <input type="file" id="chatFileInput" accept=".txt,.md,.json,.csv,.log,.js,.ts,.py,.html,.css,.xml" hidden />
        </div>
        <div class="chat-input-wrap">
          <textarea id="chatInput" rows="1" placeholder="发送消息…"></textarea>
          <button type="button" class="chat-send-btn" id="sendChatBtn" title="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6l17.5-7.6c.8-.3.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.2 1l1.7 6.3c.1.4.4.7.8.8l7.6 1.3-7.6 1.3c-.4.1-.7.4-.8.8L2.2 19.6c-.2.7.5 1.3 1.2 1z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
