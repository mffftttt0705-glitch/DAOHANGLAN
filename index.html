<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具导航</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 液态背景 -->
  <div class="liquid-bg" id="liquidBg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="custom-bg" id="customBg"></div>
  <div class="bg-overlay"></div>

  <!-- 特效画布：花瓣 / 雪花 / 雨 -->
  <canvas id="fxCanvas" class="fx-canvas"></canvas>

  <div class="page">
    <!-- 装饰顶线 -->
    <div class="deco-top" aria-hidden="true">
      <span class="deco-line"></span>
      <span class="deco-dot"></span>
      <span class="deco-line"></span>
    </div>

    <!-- 个人区：仅一个头像 -->
    <section class="profile">
      <div class="avatar-frame">
        <div class="avatar-ring"></div>
        <img id="avatarImg" class="avatar" src="" alt="头像" />
      </div>

      <div class="name-block">
        <div class="deco-side-lines" aria-hidden="true">
          <span></span><span></span>
        </div>
        <h1 id="displayName" class="name">未设置昵称</h1>
        <div class="deco-side-lines" aria-hidden="true">
          <span></span><span></span>
        </div>
      </div>

      <p id="displayBio" class="bio">点击右下角设置进行个性化</p>

      <div class="deco-underline" aria-hidden="true">
        <span class="deco-line short"></span>
        <span class="deco-diamond"></span>
        <span class="deco-line short"></span>
      </div>
    </section>

    <section class="links">
      <a href="https://wangye-zhizuo-diy.pages.dev/" target="_blank" rel="noopener" class="link-box">
        <span class="link-title">网页DIY制作</span>
        <span class="link-desc">在线制作与自定义网页</span>
      </a>
      <a href="https://qw-frontend-4i2.pages.dev/" target="_blank" rel="noopener" class="link-box">
        <span class="link-title">游戏陪玩护航</span>
        <span class="link-desc">游戏陪玩与护航服务</span>
      </a>
      <button type="button" class="link-box" id="openConverter">
        <span class="link-title">视频 → MP3</span>
        <span class="link-desc">本地转换，支持常见视频格式</span>
      </button>
    </section>

    <div class="deco-bottom" aria-hidden="true">
      <span class="deco-line"></span>
      <span class="deco-dot"></span>
      <span class="deco-line"></span>
    </div>
  </div>

  <!-- 特效快捷切换（无需密码） -->
  <div class="fx-bar" id="fxBar">
    <button type="button" class="fx-btn active" data-fx="none" title="无特效">关</button>
    <button type="button" class="fx-btn" data-fx="petal" title="花瓣">🌸</button>
    <button type="button" class="fx-btn" data-fx="snow" title="雪花">❄</button>
    <button type="button" class="fx-btn" data-fx="rain" title="下雨">🌧</button>
  </div>

  <button type="button" class="fab" id="settingsBtn" title="设置">⚙</button>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-panel glass">
      <h2>个性化设置</h2>
      <p class="modal-hint">需要密码才能修改</p>

      <div class="field">
        <label>密码</label>
        <input type="password" id="pwdInput" placeholder="输入密码" autocomplete="off" />
      </div>

      <div id="settingsForm" class="settings-form" hidden>
        <div class="field">
          <label>昵称</label>
          <input type="text" id="nameInput" placeholder="显示名称" maxlength="20" />
        </div>
        <div class="field">
          <label>简介</label>
          <input type="text" id="bioInput" placeholder="一句话介绍" maxlength="40" />
        </div>
        <div class="field">
          <label>头像（图片链接或本地上传）</label>
          <input type="text" id="avatarUrlInput" placeholder="https://... 图片地址" />
          <input type="file" id="avatarFileInput" accept="image/*" />
        </div>
        <div class="field">
          <label>背景图（图片链接或本地上传）</label>
          <input type="text" id="bgUrlInput" placeholder="https://... 图片地址" />
          <input type="file" id="bgFileInput" accept="image/*" />
          <button type="button" class="btn-text" id="clearBgBtn">清除背景图</button>
        </div>
        <div class="field">
          <label>飘落特效</label>
          <select id="fxSelect">
            <option value="none">关闭</option>
            <option value="petal">花瓣</option>
            <option value="snow">雪花</option>
            <option value="rain">下雨</option>
          </select>
        </div>
        <button type="button" class="btn primary" id="saveBtn">保存</button>
      </div>

      <button type="button" class="btn ghost" id="closeModal">关闭</button>
    </div>
  </div>

  <div class="modal" id="converterModal" hidden>
    <div class="modal-mask" id="converterMask"></div>
    <div class="modal-panel glass converter-panel">
      <h2>视频 → MP3</h2>
      <p class="modal-hint">浏览器本地转换，文件不上传 · 建议 ≤5 分钟、≤150MB</p>

      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="video/*,audio/*,.mp4,.webm,.mov,.mkv,.avi,.flv,.wmv,.m4v,.3gp,.ts,.mpeg,.mpg,.ogv,.m4a" hidden />
        <div class="upload-content" id="uploadContent">
          <p>点击或拖拽视频到这里</p>
          <span class="hint">MP4 / MOV / MKV / WebM / AVI 等均可</span>
        </div>
        <div class="file-info" id="fileInfo" hidden>
          <span id="fileName"></span>
          <button type="button" class="btn-text" id="clearBtn">清除</button>
        </div>
      </div>

      <button type="button" class="btn primary" id="convertBtn" disabled>开始转换</button>

      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p class="progress-text" id="progressText">准备中…</p>
      </div>

      <div class="result" id="result" hidden>
        <p class="ok">转换完成</p>
        <a id="downloadLink" class="btn primary" download="output.mp3">下载 MP3</a>
      </div>

      <button type="button" class="btn ghost" id="closeConverter">关闭</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
