<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具导航 · 液态玻璃</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 动态液态背景 -->
  <div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <!-- 标题 -->
    <header class="header glass">
      <h1>工具导航</h1>
      <p>液态玻璃 · 简洁高效</p>
    </header>

    <!-- 两个站点入口 -->
    <section class="cards">
      <a href="https://wangye-zhizuo-diy.pages.dev/" target="_blank" rel="noopener" class="card glass">
        <div class="card-icon">🌐</div>
        <h2>网页DIY制作</h2>
        <p>在线制作与自定义网页</p>
        <span class="card-arrow">→</span>
      </a>

      <a href="https://qw-frontend-4i2.pages.dev/" target="_blank" rel="noopener" class="card glass">
        <div class="card-icon">🎮</div>
        <h2>游戏陪玩护航</h2>
        <p>游戏陪玩与护航服务</p>
        <span class="card-arrow">→</span>
      </a>
    </section>

    <!-- MP4 转 MP3 -->
    <section class="converter glass">
      <h2>MP4 → MP3 转换</h2>
      <p class="desc">在浏览器本地转换，文件不会上传到服务器</p>

      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="video/mp4,video/*,.mp4" hidden />
        <div class="upload-content" id="uploadContent">
          <div class="upload-icon">📁</div>
          <p>点击或拖拽 MP4 文件到这里</p>
          <span class="hint">支持 MP4 / WebM 等常见视频格式</span>
        </div>
        <div class="file-info" id="fileInfo" hidden>
          <span id="fileName"></span>
          <button type="button" class="btn-clear" id="clearBtn">清除</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="convertBtn" disabled>开始转换</button>
      </div>

      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">准备中…</p>
      </div>

      <div class="result" id="result" hidden>
        <p>转换完成！</p>
        <a id="downloadLink" class="btn primary" download="output.mp3">下载 MP3</a>
      </div>
    </section>

    <footer class="footer">
      <p>本地处理 · 隐私安全 · Cloudflare Pages</p>
    </footer>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
